<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>LES AILES Photo Compare</title><style>
*{box-sizing:border-box}body{margin:0;background:#161b22;color:#fff;font:16px -apple-system,sans-serif;text-align:center}main{max-width:1000px;margin:auto;padding:12px}h1{font-size:20px}button,label.pick{display:inline-block;background:#303b49;color:white;border:1px solid #637184;border-radius:9px;padding:12px;margin:3px;font-size:16px;cursor:pointer}input[type=file]{display:none}canvas{display:block;width:100%;height:auto;max-height:58vh;object-fit:contain;background:#101419;touch-action:none}input[type=range]{width:90%;height:35px}button.active{background:#087eab}button:disabled{opacity:.4}small{color:#bbc4ce}#out img{max-width:100%}</style><main><h1>LES AILES Photo Compare</h1><label class="pick">写真①を選択<input id="f0" type="file" accept="image/*"></label><label class="pick">写真②を選択<input id="f1" type="file" accept="image/*"></label><canvas id="c" width="1200" height="900"></canvas><div id="pct">写真① 50% ／ 写真② 50%</div><input id="mix" type="range" min="0" max="100" value="50"><div>操作する写真：<button id="b0">写真①</button><button id="b1" class="active">写真②</button></div><div><button data-x="-1">←</button><button data-y="-1">↑</button><button data-y="1">↓</button><button data-x="1">→</button><button id="minus">−</button><button id="plus">＋</button><button id="reset">リセット</button></div><button id="save" disabled>画像を保存</button><div><small>選択した写真をドラッグで移動・2本指で拡大縮小</small></div><div id="status" role="status"></div><div id="out"></div></main><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),mix=document.getElementById('mix'),status=document.getElementById('status'),save=document.getElementById('save');
const a=[{im:null,x:0,y:0,z:1},{im:null,x:0,y:0,z:1}];let selected=1;
function draw(){ctx.globalAlpha=1;ctx.fillStyle='#101419';ctx.fillRect(0,0,c.width,c.height);let t=+mix.value/100;document.getElementById('pct').textContent='写真① '+(100-mix.value)+'% ／ 写真② '+mix.value+'%';function layer(o,alpha){if(!o.im)return;let s=Math.min(c.width/o.im.width,c.height/o.im.height)*o.z,w=o.im.width*s,h=o.im.height*s;ctx.globalAlpha=alpha;ctx.drawImage(o.im,(c.width-w)/2+o.x,(c.height-h)/2+o.y,w,h)}if(a[0].im&&a[1].im){layer(a[0],1);layer(a[1],t);if(t===1){ctx.globalAlpha=1;ctx.fillRect(0,0,c.width,c.height);layer(a[1],1)}}else{layer(a[0],1);layer(a[1],1)}ctx.globalAlpha=1;save.disabled=!(a[0].im&&a[1].im)}
// Composite each image on an opaque background so the slider is a true crossfade even outside image bounds.
const originalDraw=draw;
draw=function(){originalDraw();if(a[0].im&&a[1].im){let t=+mix.value/100;ctx.globalAlpha=t;ctx.fillStyle='#101419';// use an offscreen layer for the second image
let o=a[1],s=Math.min(c.width/o.im.width,c.height/o.im.height)*o.z,w=o.im.width*s,h=o.im.height*s;
ctx.globalAlpha=1;ctx.fillRect(0,0,c.width,c.height);
let q=a[0],k=Math.min(c.width/q.im.width,c.height/q.im.height)*q.z,u=q.im.width*k,v=q.im.height*k;ctx.drawImage(q.im,(c.width-u)/2+q.x,(c.height-v)/2+q.y,u,v);
let g=layerCanvas.getContext('2d');g.fillStyle='#101419';g.fillRect(0,0,c.width,c.height);g.drawImage(o.im,(c.width-w)/2+o.x,(c.height-h)/2+o.y,w,h);ctx.globalAlpha=t;ctx.drawImage(layerCanvas,0,0);ctx.globalAlpha=1;}};
const layerCanvas=document.createElement('canvas');layerCanvas.width=c.width;layerCanvas.height=c.height;
function select(i){selected=i;[0,1].forEach(j=>document.getElementById('b'+j).classList.toggle('active',i===j))}
[0,1].forEach(i=>{document.getElementById('b'+i).onclick=()=>select(i);document.getElementById('f'+i).onchange=function(){let f=this.files[0];if(!f)return;let url=URL.createObjectURL(f),im=new Image();im.onload=()=>{a[i]={im:im,x:0,y:0,z:1};URL.revokeObjectURL(url);select(i);draw();status.textContent=''};im.onerror=()=>{URL.revokeObjectURL(url);status.textContent='写真を読み込めません。JPEGまたはPNGをお試しください。'};im.src=url;this.value=''}});
mix.oninput=draw;
document.querySelectorAll('[data-x],[data-y]').forEach(b=>b.onclick=()=>{a[selected].x+=Number(b.dataset.x||0)*3;a[selected].y+=Number(b.dataset.y||0)*3;draw()});
function zoom(k){a[selected].z=Math.max(.2,Math.min(8,a[selected].z*k));draw()}
document.getElementById('minus').onclick=()=>zoom(.95);document.getElementById('plus').onclick=()=>zoom(1.05);document.getElementById('reset').onclick=()=>{Object.assign(a[selected],{x:0,y:0,z:1});draw()};
function point(x,y){let r=c.getBoundingClientRect(),s=Math.min(r.width/c.width,r.height/c.height);return [(x-r.left-r.width/2)/s,(y-r.top-r.height/2)/s]}
let prev=null;function gesture(t){let p=point(t[0].clientX,t[0].clientY);if(t.length<2)return [p[0],p[1],0];let q=point(t[1].clientX,t[1].clientY);return [(p[0]+q[0])/2,(p[1]+q[1])/2,Math.hypot(p[0]-q[0],p[1]-q[1])]}
c.addEventListener('touchstart',e=>{e.preventDefault();prev=gesture(e.touches)},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();let n=gesture(e.touches),o=a[selected];if(prev){let k=prev[2]&&n[2]?Math.max(.2,Math.min(8,o.z*n[2]/prev[2]))/o.z:1;o.x=n[0]-(prev[0]-o.x)*k;o.y=n[1]-(prev[1]-o.y)*k;o.z*=k;draw()}prev=n},{passive:false});function end(e){prev=e.touches.length?gesture(e.touches):null}c.addEventListener('touchend',end);c.addEventListener('touchcancel',end);
let mouse=null;c.addEventListener('mousedown',e=>{mouse=point(e.clientX,e.clientY)});window.addEventListener('mousemove',e=>{if(!mouse)return;let n=point(e.clientX,e.clientY);a[selected].x+=n[0]-mouse[0];a[selected].y+=n[1]-mouse[1];mouse=n;draw()});window.addEventListener('mouseup',()=>mouse=null);
save.onclick=()=>{let out=document.getElementById('out');out.innerHTML='';let im=new Image();im.src=c.toDataURL('image/png');out.appendChild(im);status.textContent='下の画像を長押しして「写真に保存」を選択してください。';let link=document.createElement('a');link.href=im.src;link.download='photo-compare.png';link.textContent='PNGをダウンロード';link.style.color='white';out.appendChild(link)};
draw();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
